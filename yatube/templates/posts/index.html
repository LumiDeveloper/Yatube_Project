{% extends "base.html" %}

{% block content %}
  <div class="container py-5">     
    <h1>Последние обновления на сайте</h1>
    {% for post in posts %}
      
      {# Передаем post из цикла в переменную item для шаблона article.html #}
      {% include 'includes/main/article.html' with item=post %}
      
      {% if not forloop.last %}<hr>{% endif %}
    {% endfor %}
  </div>  
{% endblock %}
